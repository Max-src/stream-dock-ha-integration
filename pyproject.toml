[project]
name = "stream-dock-ha-integration"
version = "0.1.12"
description = "Home Assistant integration for the Stream Dock HA app"
requires-python = ">=3.14"

[dependency-groups]
test = ["pytest-homeassistant-custom-component==0.13.375"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = [
  "E501",    # line length is left to the formatter
  "PLR0913", # too many arguments
  "PLR2004", # magic values, common in tests
  "RUF012",  # Home Assistant's _attr_ class attributes
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
