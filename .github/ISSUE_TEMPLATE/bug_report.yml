name: Something doesn't work
description: A problem with the integration, its cards, actions or blueprints in Home Assistant
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is for the Home Assistant side. For the Windows app itself (keys, pads, Mini Monitor, its window), open an issue in [Stream Dock HA, the app](https://github.com/Max-src/stream-dock-ha/issues) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Add the pad card to a dashboard\n2. Tap key 3\n3. ..."
  - type: input
    id: integration
    attributes:
      label: Integration version
      description: Shown in Settings > Marketplace, or in the "version" line of custom_components/stream_dock_ha/manifest.json
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App version
      description: Next to the name at the top of the app's window, like v1.1.0
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      description: Settings > About
    validations:
      required: true
  - type: input
    id: pads
    attributes:
      label: Pads
      placeholder: StreamDock 293S, AJAZZ AKP03E, virtual pad
  - type: textarea
    id: integration-line
    attributes:
      label: What the app says about the integration
      description: The line under "Show this PC and its pads in Home Assistant", in the app's Settings > Home Assistant
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics or logs
      description: |
        "Download diagnostics" on the integration's page, and the lines about the integration in the app's pad-log.txt (in %APPDATA%\StreamDockHA). Remove your Home Assistant address and anything private first.
      render: text
