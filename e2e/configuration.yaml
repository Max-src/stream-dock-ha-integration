# A small, made-up home for end-to-end tests. No real devices.
homeassistant:
  name: E2E test home
  unit_system: metric
  time_zone: Europe/Paris
  latitude: 48.85
  longitude: 2.35

http:
  server_port: 8124

frontend:
api:
config:
history:
recorder:
  purge_keep_days: 1
lovelace:
logger:
  default: warning
  logs:
    custom_components.stream_dock_ha: debug

input_boolean:
  desk_lamp:
    name: Desk lamp
  doorbell:
    name: Doorbell

input_number:
  living_room_temperature:
    name: Living room temperature
    min: 10
    max: 30
    step: 0.1
    unit_of_measurement: "°C"
